[project]
name = "prova"
version = "0.0.0"
description = "Prova: a checked evaluator for core-0 programs"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
prova = "prova.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
